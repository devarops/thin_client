---
- name: Install software using package managers
  hosts: devserver
  tasks:
    - name: Install bat (batcat)
      ansible.builtin.apt:
        name: bat
        state: present
      become: true
    - name: Install lsof (list open files)
      ansible.builtin.apt:
        name: lsof
        state: present
      become: true
    - name: Install Neofetch
      ansible.builtin.apt:
        name: neofetch
        state: present
      become: true
    - name: Install Neovim
      community.general.snap:
        name: nvim
        classic: true
      become: true
    - name: Install Node.js
      community.general.snap:
        name: node
        classic: true
      become: true
    - name: Install ripgrep
      ansible.builtin.apt:
        name: ripgrep
        state: present
      become: true
    - name: Install tmux
      community.general.snap:
        name: tmux
        classic: true
      become: true

- name: Install Python Language Server
  hosts: devserver
  tasks:
    - name: Install pyright (Python type checking)
      ansible.builtin.npm:
        name: pyright
        global: true
      become: true

- name: Install Lua Language Server
  hosts: devserver
  tasks:
    - name: Install ninja-build (required for lua-language-server)
      ansible.builtin.apt:
        name: ninja-build
        state: present
      become: true
    - name: Clone lua-language-server repo
      ansible.builtin.git:
        repo: https://github.com/LuaLS/lua-language-server.git
        dest: /opt/lua-language-server
        version: master
        recursive: true
        force: true
      become: true
    - name: Build lua-language-server
      ansible.builtin.shell: ./make.sh
      args:
        chdir: /opt/lua-language-server
        creates: /opt/lua-language-server/bin/lua-language-server
      become: true
    - name: Ensure lua-language-server is in PATH
      ansible.builtin.file:
        src: /opt/lua-language-server/bin/lua-language-server
        dest: /usr/local/bin/lua-language-server
        state: link
        force: true
      become: true
    - name: Ensure ownership of lua-language-server is set to current user
      ansible.builtin.file:
        path: /opt/lua-language-server
        owner: "{{ ansible_user_id }}"
        group: "{{ ansible_user_id }}"
        recurse: true
      become: true

- name: Install R Language Server
  hosts: devserver
  tasks:
    - name: Install R base
      ansible.builtin.apt:
        name: r-base
        state: present
      become: true
    - name: Install libxml2-dev
      ansible.builtin.apt:
        name: libxml2-dev
        state: present
      become: true
    - name: Install R 'languageserver' package
      ansible.builtin.command: >
        Rscript -e "install.packages('languageserver', repos = 'https://cloud.r-project.org')"
      become: true

- name: Install OpenCode
  hosts: devserver
  tasks:
    - name: Install opencode
      ansible.builtin.shell: |
        curl -fsSL https://opencode.ai/install | bash
      args:
        creates: "{{ ansible_env.HOME }}/.opencode/bin/opencode"
      environment:
        HOME: "{{ ansible_env.HOME }}"
    - name: Ensure opencode is in PATH (bashrc)
      ansible.builtin.lineinfile:
        path: "{{ ansible_env.HOME }}/.bashrc"
        line: 'export PATH=$PATH:$HOME/.opencode/bin'
        create: true
