---
- name: Install software using package managers
  hosts: thin_client
  tasks:
    - name: Install bat (batcat)
      ansible.builtin.apt:
        name: bat
        state: present
      become: true
    - name: Install fdfind
      ansible.builtin.apt:
        name: fd-find
        state: present
      become: true
    - name: Install GitHub CLI
      ansible.builtin.apt:
        name: gh
        state: present
      become: true
    - name: Install lsof (list open files)
      ansible.builtin.apt:
        name: lsof
        state: present
      become: true
    - name: Install Neofetch
      ansible.builtin.apt:
        name: neofetch
        state: present
      become: true
    - name: Install Neovim
      community.general.snap:
        name: nvim
        classic: true
      become: true
    - name: Install Node.js
      community.general.snap:
        name: node
        classic: true
      become: true
    - name: Install ripgrep
      ansible.builtin.apt:
        name: ripgrep
        state: present
      become: true
    - name: Install tmux
      community.general.snap:
        name: tmux
        classic: true
      become: true

- name: Install software using npm
  hosts: thin_client
  tasks:
    - name: Install Gemini CLI
      ansible.builtin.npm:
        name: "@google/gemini-cli"
        global: true
      become: true
    - name: Install Python Language Server
      ansible.builtin.npm:
        name: pyright
        global: true
      become: true
    - name: Install tree-sitter-cli (required by nvim-treesitter main branch)
      ansible.builtin.npm:
        name: tree-sitter-cli
        global: true
      become: true

- name: Install Lua Language Server
  hosts: thin_client
  vars:
    lua_ls_version: "3.18.2"
    lua_ls_url: "https://github.com/LuaLS/lua-language-server/releases/download/{{ lua_ls_version }}/lua-language-server-{{ lua_ls_version }}-linux-x64.tar.gz"
  tasks:
    - name: Download lua-language-server binary
      ansible.builtin.get_url:
        url: "{{ lua_ls_url }}"
        dest: /tmp/lua-language-server-{{ lua_ls_version }}-linux-x64.tar.gz
        mode: '0644'
      become: true
    - name: Create lua-language-server directory
      ansible.builtin.file:
        path: /opt/lua-language-server
        state: directory
        mode: '0755'
      become: true
    - name: Extract lua-language-server to /opt
      ansible.builtin.unarchive:
        src: /tmp/lua-language-server-{{ lua_ls_version }}-linux-x64.tar.gz
        dest: /opt/lua-language-server
        remote_src: true
        creates: /opt/lua-language-server/bin/lua-language-server
      become: true
    - name: Ensure lua-language-server is in PATH
      ansible.builtin.file:
        src: /opt/lua-language-server/bin/lua-language-server
        dest: /usr/local/bin/lua-language-server
        state: link
        force: true
      become: true

- name: Install R Language Server
  hosts: thin_client
  tasks:
    - name: Install R base
      ansible.builtin.apt:
        name: r-base
        state: present
      become: true
    - name: Install libxml2-dev
      ansible.builtin.apt:
        name: libxml2-dev
        state: present
      become: true
    - name: Install R 'languageserver' package
      ansible.builtin.command: >
        Rscript -e "install.packages('languageserver', repos = 'https://cloud.r-project.org')"
      become: true

- name: Install OpenCode
  hosts: thin_client
  tasks:
    - name: Install opencode
      ansible.builtin.shell: |
        curl -fsSL https://opencode.ai/install | bash
      args:
        creates: "{{ ansible_env.HOME }}/.opencode/bin/opencode"
      environment:
        HOME: "{{ ansible_env.HOME }}"
    - name: Ensure opencode is in PATH (bashrc)
      ansible.builtin.lineinfile:
        path: "{{ ansible_env.HOME }}/.bashrc"
        line: 'export PATH=$PATH:$HOME/.opencode/bin'
        create: true
