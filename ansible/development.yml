---
- name: Install software using package managers
  hosts: development
  tasks:
    - name: Install batcat
      ansible.builtin.apt:
        name: bat
        state: present
      become: true
    - name: Install Fastfetch
      ansible.builtin.apt:
        name: fastfetch
        state: present
      become: true
    - name: Install fdfind
      ansible.builtin.apt:
        name: fd-find
        state: present
      become: true
    - name: Install GitHub CLI
      ansible.builtin.apt:
        name: gh
        state: present
      become: true
    - name: Install libuv (required for R fs package)
      ansible.builtin.apt:
        name: libuv1-dev
        state: present
        update_cache: true
      become: true
    # The snap store answers 429 to bursty hosts, and snapd reports that as
    # "no snap found"; retry until the store accepts the request.
    - name: Install Neovim
      community.general.snap:
        name: nvim
        classic: true
      become: true
      register: nvim_snap
      until: nvim_snap is not failed
      retries: 12
      delay: 15
    - name: Install Node.js and npm
      ansible.builtin.apt:
        name:
          - nodejs
          - npm
        state: present
        update_cache: true
      become: true
    - name: Install ripgrep
      ansible.builtin.apt:
        name: ripgrep
        state: present
      become: true
    - name: Install tmux
      community.general.snap:
        name: tmux
        classic: true
      become: true
      register: tmux_snap
      until: tmux_snap is not failed
      retries: 12
      delay: 15

- name: Install software using npm
  hosts: development
  tasks:
    - name: Install Python Language Server
      ansible.builtin.npm:
        name: pyright
        global: true
      become: true
    - name: Install tree-sitter-cli (required by nvim-treesitter main branch)
      ansible.builtin.npm:
        name: tree-sitter-cli
        global: true
      become: true

- name: Install Lua Language Server
  hosts: development
  vars:
    lua_ls_version: "3.18.2"
    lua_ls_url: "https://github.com/LuaLS/lua-language-server/releases/download/{{ lua_ls_version }}/lua-language-server-{{ lua_ls_version }}-linux-x64.tar.gz"
  tasks:
    - name: Download lua-language-server binary
      ansible.builtin.get_url:
        url: "{{ lua_ls_url }}"
        dest: /tmp/lua-language-server-{{ lua_ls_version }}-linux-x64.tar.gz
        mode: '0644'
      become: true
    - name: Create lua-language-server directory
      ansible.builtin.file:
        path: /opt/lua-language-server
        state: directory
        mode: '0755'
      become: true
    - name: Extract lua-language-server to /opt
      ansible.builtin.unarchive:
        src: /tmp/lua-language-server-{{ lua_ls_version }}-linux-x64.tar.gz
        dest: /opt/lua-language-server
        remote_src: true
        creates: /opt/lua-language-server/bin/lua-language-server
      become: true
    - name: Ensure lua-language-server is in PATH
      ansible.builtin.file:
        src: /opt/lua-language-server/bin/lua-language-server
        dest: /usr/local/bin/lua-language-server
        state: link
        force: true
      become: true

- name: Install R Language Server
  hosts: development
  tasks:
    - name: Install R base
      ansible.builtin.apt:
        name: r-base
        state: present
      become: true
    - name: Install libxml2-dev
      ansible.builtin.apt:
        name: libxml2-dev
        state: present
      become: true
    - name: Install R build tools (compilers required to build CRAN packages)
      ansible.builtin.apt:
        name: r-base-dev
        state: present
        update_cache: true
      become: true
    - name: Install R 'languageserver' package
      ansible.builtin.command: >
        Rscript
        -e "install.packages('languageserver', repos = 'https://cloud.r-project.org')"
        -e "quit(status = !requireNamespace('languageserver', quietly = TRUE))"
      args:
        creates: /usr/local/lib/R/site-library/languageserver
      become: true

- name: Install AI Agents
  hosts: development
  tasks:
    - name: Read the installed opencode version
      ansible.builtin.command:
        cmd: "{{ ansible_facts.env.HOME }}/.opencode/bin/opencode --version"
      register: opencode_version
      changed_when: false
      failed_when: false
    # https://opencode.ai/install only serves OpenCode 1; the check target
    # requires the OpenCode 2 binary.
    - name: Install opencode
      ansible.builtin.shell: |
        curl -fsSL https://opencode.ai/v2/install | bash
      when: opencode_version.stdout is not search('^opencode v2\.')
      environment:
        HOME: "{{ ansible_facts.env.HOME }}"
    - name: Ensure opencode is in PATH (bashrc)
      ansible.builtin.lineinfile:
        path: "{{ ansible_facts.env.HOME }}/.bashrc"
        line: 'export PATH=$PATH:$HOME/.opencode/bin'
        create: true
    - name: Install pi
      ansible.builtin.shell: |
        npm install -g --ignore-scripts --prefix ~/.local @earendil-works/pi-coding-agent
      args:
        creates: "{{ ansible_facts.env.HOME }}/.local/bin/pi"
      environment:
        HOME: "{{ ansible_facts.env.HOME }}"

- name: Install terminal information
  hosts: development
  tasks:
    - name: Install Ghostty terminal information
      ansible.builtin.command:
        cmd: tic -x -o /usr/share/terminfo -
        stdin: "{{ lookup('file', 'files/xterm-ghostty.terminfo') }}"
        creates: /usr/share/terminfo/x/xterm-ghostty
      become: true
      when: ansible_connection != 'local'
